name: Task watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # lets you run it by hand from the Actions tab

# Only one run at a time, so two runs can't send the same alert twice
concurrency:
  group: task-watcher
  cancel-in-progress: false

permissions:
  contents: write            # so it can remember where it got to

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what it needs
        run: pip install -r cloud/requirements.txt

      - name: Check for new tasks
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        run: python check_once.py

      - name: Remember where it got to
        run: |
          rm -f google_calendar_key.json
          git config user.name  "task-watcher"
          git config user.email "task-watcher@users.noreply.github.com"
          git add last_seen.json
          git diff --staged --quiet || git commit -m "checked for new tasks"
          git push
