name: Task watcher

# GitHub's scheduler drops most short-interval runs, so we don't rely on it
# to drive each check. It only needs to start a run; that run then stays
# alive for hours and checks every couple of minutes from inside.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# One run at a time. While a long run is alive, the next scheduled run waits
# its turn and starts the moment this one ends, keeping cover continuous.
concurrency:
  group: task-watcher
  cancel-in-progress: false

permissions:
  contents: write            # so it can remember where it got to

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what it needs
        run: pip install -r cloud/requirements.txt

      - name: Watch for new tasks
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
          LOOP_MINUTES: "330"     # stay alive 5.5 hours
          CHECK_INTERVAL: "120"   # look every 2 minutes
        run: python check_once.py

      - name: Remember where it got to
        if: always()
        run: |
          rm -f google_calendar_key.json
          git config user.name  "task-watcher"
          git config user.email "task-watcher@users.noreply.github.com"
          git add last_seen.json
          git diff --staged --quiet && exit 0
          git commit -m "checked for new tasks"
          git pull --rebase --autostash -q
          git push
